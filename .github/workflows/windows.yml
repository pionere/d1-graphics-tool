name: Windows

on: [ push, pull_request ]
#on:
#  push:
#    branches: [ "master" ]
#  pull_request:
#    branches: [ "master" ]

jobs:
  build:

    #runs-on: windows-latest
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.2.4'
        cache: 'true'
        modules: 'qtmultimedia qtimageformats'

    - name: Download Torch
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://download.pytorch.org/libtorch/cpu/libtorch-win-shared-with-deps-2.14.1%2Bcpu.zip" -OutFile "libtorch.zip"
        unzip libtorch.zip -d /libtorch

    - name: Show content of workspace
      run: find $RUNNER_WORKSPACE
      shell: bash

    #winget -O libtorch.zip https://download.pytorch.org/libtorch/cpu/libtorch-win-shared-with-deps-2.14.1%2Bcpu.zip
    #unzip libtorch.zip -d /libtorch
    - name: Install Torch
      run: |
        unzip libtorch.zip
      shell: cmd

    - name: Configure
      run: cmake -S. -Bbuild -DCMAKE_PREFIX_PATH=/libtorch

    - name: Make
      run: cmake --build build -j $(nproc) --config Release

    - name: Package
      run: |
        mkdir dist
        copy build\Release\D1GraphicsTool.exe dist
        cd dist
        windeployqt D1GraphicsTool.exe --no-compiler-runtime --no-opengl-sw --no-system-d3d-compiler --no-virtualkeyboard --no-translations --no-quick-import
      shell: cmd

    - name: Upload
      if: ${{ !env.ACT }}
      uses: actions/upload-artifact@v7
      with:
        name: D1GraphicsTool-Windows-x64
        path: dist

    - name: Upload-translations
      #if: ${{ !env.ACT }}
      if: false
      uses: actions/upload-artifact@v7
      with:
        name: D1GraphicsTool-Translations
        path: languages

    - name: Upload bin
      if: ${{ !env.ACT }}
      uses: actions/upload-artifact@v7
      with:
        name: D1GraphicsTool.exe
        path: build\Release\D1GraphicsTool.exe
