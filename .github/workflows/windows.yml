name: Windows

on: [ push, pull_request ]
#on:
#  push:
#    branches: [ "master" ]
#  pull_request:
#    branches: [ "master" ]

jobs:
  build:

    #runs-on: windows-latest
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.2.4'
        cache: 'true'
        modules: 'qtmultimedia qtimageformats'

    - name: Download Torch
      uses: suisei-cn/actions-download-file@v1 # 9f75b8c2dad5ccced7509c44a3b881c5613abde2 # 1.6.1
      #id: downloadfile  # Remember to give an ID if you need the output filename
      with:
        url: "https://download.pytorch.org/libtorch/cpu/libtorch-win-shared-with-deps-2.14.1%2Bcpu.zip"
        target: libtorch.zip

    #winget -O libtorch.zip https://download.pytorch.org/libtorch/cpu/libtorch-win-shared-with-deps-2.14.1%2Bcpu.zip
    - name: Install Torch
      run: |
        unzip libtorch.zip -d /libtorch
      shell: cmd

    - name: Configure
      run: cmake -S. -Bbuild -DCMAKE_PREFIX_PATH=/libtorch

    - name: Make
      run: cmake --build build -j $(nproc) --config Release

    - name: Package
      run: |
        mkdir dist
        copy build\Release\D1GraphicsTool.exe dist
        cd dist
        windeployqt D1GraphicsTool.exe --no-compiler-runtime --no-opengl-sw --no-system-d3d-compiler --no-virtualkeyboard --no-translations --no-quick-import
      shell: cmd

    - name: Upload
      if: ${{ !env.ACT }}
      uses: actions/upload-artifact@v7
      with:
        name: D1GraphicsTool-Windows-x64
        path: dist

    - name: Upload-translations
      #if: ${{ !env.ACT }}
      if: false
      uses: actions/upload-artifact@v7
      with:
        name: D1GraphicsTool-Translations
        path: languages

    - name: Upload bin
      if: ${{ !env.ACT }}
      uses: actions/upload-artifact@v7
      with:
        name: D1GraphicsTool.exe
        path: build\Release\D1GraphicsTool.exe
